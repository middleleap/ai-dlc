<title>Loom Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* The Loom console — styles. No external fonts: the app makes no network call; the faces fall back
   to the system stack when Instrument Serif, DM Sans and JetBrains Mono are not installed. */
:root{
  --ember-400:#F0722E;--ember-500:#E65C2D;--ember-dim:rgba(230,92,45,.14);
  --font-display:'Instrument Serif',Georgia,serif;
  --font-body:'DM Sans',Arial,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --dur-base:200ms;--dur-leap:400ms;--ease-leap:cubic-bezier(.34,1.3,.4,1);
}
/* dark (default) */
:root,:root[data-theme="dark"]{
  color-scheme:dark;
  --ink-0:#080808;--ink-1:#101010;--ink-2:#181817;--ink-3:#232321;--ink-4:#33322F;--ink-border:#1E1E1C;
  --bone-0:#ECE9E1;--bone-1:#DEDBD4;--bone-2:#A8A59E;--bone-3:#87847D;--bone-4:#4A4945;
  --ember-300:#F58F55;--on-ember:#110D0A;
  --positive:#5FA671;--positive-dim:rgba(95,166,113,.14);
  --caution:#D9A03C;--caution-dim:rgba(217,160,60,.14);
  --critical:#D64545;--critical-text:#E06060;--critical-dim:rgba(214,69,69,.14);
  --info:#5D8FA6;--info-text:#8DB6C9;--info-dim:rgba(93,143,166,.14);
  --shadow:0 12px 40px rgba(0,0,0,.5);
}
/* light: the same roles, inverted onto bone */
:root[data-theme="light"]{
  color-scheme:light;
  --ink-0:#F6F4EE;--ink-1:#EFECE4;--ink-2:#FFFFFF;--ink-3:#E9E5DB;--ink-4:#CFCAC0;--ink-border:#E2DED4;
  --bone-0:#121211;--bone-1:#2A2926;--bone-2:#55534E;--bone-3:#716E67;--bone-4:#B5B1A8;
  --ember-300:#C4471F;--on-ember:#FFFFFF;
  --positive:#3B7A4C;--positive-dim:rgba(59,122,76,.12);
  --caution:#94650C;--caution-dim:rgba(217,160,60,.18);
  --critical:#C23B3B;--critical-text:#B02E2E;--critical-dim:rgba(194,59,59,.1);
  --info:#3E7690;--info-text:#2F6680;--info-dim:rgba(62,118,144,.12);
  --shadow:0 12px 40px rgba(40,30,20,.14);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --ink-0:#F6F4EE;--ink-1:#EFECE4;--ink-2:#FFFFFF;--ink-3:#E9E5DB;--ink-4:#CFCAC0;--ink-border:#E2DED4;
  --bone-0:#121211;--bone-1:#2A2926;--bone-2:#55534E;--bone-3:#716E67;--bone-4:#B5B1A8;
  --ember-300:#C4471F;--on-ember:#FFFFFF;
  --positive:#3B7A4C;--positive-dim:rgba(59,122,76,.12);
  --caution:#94650C;--caution-dim:rgba(217,160,60,.18);
  --critical:#C23B3B;--critical-text:#B02E2E;--critical-dim:rgba(194,59,59,.1);
  --info:#3E7690;--info-text:#2F6680;--info-dim:rgba(62,118,144,.12);
  --shadow:0 12px 40px rgba(40,30,20,.14);
}}
@media (prefers-reduced-motion:reduce){:root{--dur-base:.01ms;--dur-leap:.01ms}}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink-0);color:var(--bone-1);font-family:var(--font-body);font-size:15px;line-height:1.55;margin:0}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:400;color:var(--bone-0);margin:0;line-height:1.15;text-wrap:balance}
h1 em,h2 em{font-style:italic;color:var(--ember-500)}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--ember-300)}
:focus-visible{outline:2px solid var(--ember-400);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.label{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-3)}
.cap{font-size:12.5px;color:var(--bone-3)}
.muted{color:var(--bone-2)}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{border-right:1px solid var(--ink-border);background:var(--ink-1);padding:20px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.02em;font-size:16px;color:var(--bone-1)}
.brand b{color:var(--ember-500);font-weight:600}



.nav{display:grid;gap:2px}
.nav button{background:none;border:0;text-align:left;padding:9px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--bone-2);font-size:14px;border-left:2px solid transparent}
.nav button:hover{background:var(--ink-2);color:var(--bone-0)}
.nav button[aria-current="page"]{background:var(--ink-2);color:var(--bone-0);border-left-color:var(--ember-500)}
.nav .ct{font-family:var(--font-mono);font-size:11px;color:var(--bone-3)}
.side-foot{margin-top:auto;display:grid;gap:8px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:12px 28px;border-bottom:1px solid var(--ink-border);background:var(--ink-0);position:sticky;top:env(safe-area-inset-top,0px);z-index:4}
.crumbs{font-family:var(--font-mono);font-size:12px;color:var(--bone-3)}
.crumbs b{color:var(--bone-0);font-weight:500}
.view{padding:28px 28px 72px;max-width:1240px;width:100%}



@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--ink-border);padding:14px 16px;gap:12px}
  .nav{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto}
  .nav button{border-left:0;border-bottom:2px solid transparent}
  .nav button[aria-current="page"]{border-bottom-color:var(--ember-500)}
  .side-foot{display:none}
  .topbar{padding:10px 16px;position:static}
  .view{padding:20px 16px 56px}
}

/* primitives */
.badge{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:2px;letter-spacing:.03em;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:currentColor;flex:none}
.b-pos{background:var(--positive-dim);color:var(--positive)}
.b-cau{background:var(--caution-dim);color:var(--caution)}
.b-crit{background:var(--critical-dim);color:var(--critical-text)}
.b-info{background:var(--info-dim);color:var(--info-text)}
.b-ember{background:var(--ember-dim);color:var(--ember-300)}
.b-none{background:var(--ink-3);color:var(--bone-2)}
.card{border:1px solid var(--ink-border);background:var(--ink-2);padding:18px}
.card h3{font-size:22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-7-5{grid-template-columns:7fr 5fr}
@media (max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}.g-7-5{grid-template-columns:1fr}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.grid>*{min-width:0}
.stat{border:1px solid var(--ink-border);background:var(--ink-1);padding:16px 18px;display:grid;gap:6px;align-content:start}
.stat .big{font-family:var(--font-display);font-size:40px;line-height:1;color:var(--bone-0)}
.stat .big small{font-size:20px;color:var(--bone-3)}
.bar{display:flex;height:6px;background:var(--ink-3);gap:2px}
.bar span{display:block;height:100%}
.tbl-wrap{overflow-x:auto;border:1px solid var(--ink-border)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-3);font-weight:400;text-align:left;padding:10px 12px;border-bottom:1px solid var(--ink-4);background:var(--ink-1);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--ink-border);vertical-align:middle;background:var(--ink-2)}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--ink-3)}
.file{font-family:var(--font-mono);font-size:12px;color:var(--bone-0);background:var(--ink-0);border:1px solid var(--ink-border);padding:1px 6px;white-space:nowrap}
.btn{font-family:var(--font-mono);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:10px 14px;border:1px solid var(--ink-4);background:transparent;color:var(--bone-1);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color var(--dur-base),background var(--dur-base)}
.btn:hover{border-color:var(--bone-3)}
.btn-p{background:var(--ember-500);border-color:var(--ember-500);color:var(--on-ember)}
.btn-p::before{content:"";width:8px;height:8px;background:currentColor;transition:transform var(--dur-leap) var(--ease-leap)}
.btn-p:hover{background:var(--ember-400);border-color:var(--ember-400)}
.btn-p:hover::before{transform:rotate(45deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-mono);font-size:11.5px;padding:3px 8px;border-radius:2px;background:var(--ink-3);color:var(--bone-1);border:1px solid transparent;cursor:default}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--bone-3)}
button.chip[aria-pressed="true"]{border-color:var(--ember-500);background:var(--ember-dim);color:var(--bone-0)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{justify-content:space-between}
.stack{display:grid;gap:10px}
.dia{display:inline-block;width:8px;height:8px;transform:rotate(45deg);flex:none}
.sq{display:inline-block;width:9px;height:9px;border-radius:16%;flex:none}
.tag-src{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em;padding:2px 6px;border:1px dashed var(--bone-4);color:var(--bone-3);border-radius:2px;white-space:nowrap}

/* stage track (mini) */
.track{display:inline-flex;align-items:center;gap:3px}
.track i{display:block;width:12px;height:12px;border:1.5px solid var(--bone-4);border-radius:16%}
.track i.d{background:var(--bone-2);border-color:var(--bone-2)}
.track i.c{background:var(--ember-500);border-color:var(--ember-500);transform:rotate(45deg) scale(.86)}
.track i.f{background:var(--critical);border-color:var(--critical);transform:rotate(45deg) scale(.86)}
.track i.s{border-color:var(--bone-3);background:repeating-linear-gradient(45deg,var(--bone-4) 0 2px,transparent 2px 4px)}
.track b{width:1px;height:14px;background:var(--ember-500);margin:0 3px}
.track i.r{border-style:dashed}

/* attention */
.att{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--ink-border)}
.att:first-child{border-top:0;padding-top:0}
.att .dia{margin-top:7px}
.att b{color:var(--bone-0);font-weight:600}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(8,1fr);border:1px solid var(--ink-border)}
.pipe>div{padding:12px 10px;border-right:1px solid var(--ink-border);display:grid;gap:8px;align-content:start;min-height:150px;background:var(--ink-1)}
.pipe>div:last-child{border-right:0}
.pipe .ph{display:grid;gap:2px}
.pipe .ph b{font-family:var(--font-display);font-weight:400;font-size:17px;color:var(--bone-0);line-height:1.15}
.pipe .waist{background:var(--ink-2);box-shadow:inset 2px 0 0 var(--ember-500)}
.pcard{background:var(--ink-2);border:1px solid var(--ink-4);padding:7px 8px;font-size:12px;cursor:pointer;text-align:left;display:grid;gap:3px;color:var(--bone-1);width:100%}
.pcard:hover{border-color:var(--bone-3)}
.pcard .mono{font-size:11px}
.pipe-wrap{overflow-x:auto}
.pipe-wrap .pipe{min-width:900px}

/* brain */
.dim{border:1px solid var(--ink-border);background:var(--ink-1)}
.dim-h{padding:18px;border-bottom:1px solid var(--ink-border);display:grid;gap:6px}
.dim-h h3{font-size:24px}
.dim-b{padding:6px 18px 16px}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--ink-border);font-size:13.5px}
.kv:first-child{border-top:0}
.kv .l{display:grid;gap:1px;min-width:0}
.kv .l span:first-child{color:var(--bone-0)}
.dig{font-family:var(--font-mono);font-size:11px;color:var(--bone-3)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.cell{display:inline-block;width:12px;height:12px;border-radius:16%}
.cell.y{background:var(--bone-2)}
.cell.w{background:var(--caution);transform:rotate(45deg) scale(.8)}
.cell.n{border:1px solid var(--bone-4)}

/* run detail */
.bigtrack{display:grid;grid-template-columns:repeat(7,1fr) 1.3fr;border:1px solid var(--ink-border)}
.bt{padding:14px 12px;border-right:1px solid var(--ink-border);display:grid;gap:6px;align-content:start;background:var(--ink-1);position:relative}
.bt:last-child{border-right:0}
.bt .n{font-family:var(--font-mono);font-size:11px;color:var(--bone-3)}
.bt b{font-family:var(--font-display);font-weight:400;font-size:18px;color:var(--bone-0);line-height:1.1}
.bt .f{font-family:var(--font-mono);font-size:10.5px;color:var(--bone-2);word-break:break-all}
.bt.done{background:var(--ink-2)}
.bt.cur{background:var(--ember-dim);box-shadow:inset 0 2px 0 var(--ember-500)}
.bt.fail{background:var(--critical-dim);box-shadow:inset 0 2px 0 var(--critical)}
.bt.stop{background:var(--ink-2);box-shadow:inset 0 2px 0 var(--bone-3)}
.bt.todo b{color:var(--bone-3)}
.bt.right{background:var(--ink-0)}
.bigtrack-wrap{overflow-x:auto}
.bigtrack-wrap .bigtrack{min-width:900px}
.gates{display:flex;flex-wrap:wrap;gap:5px}
.gate{font-family:var(--font-mono);font-size:11px;padding:3px 7px;border:1px solid var(--ink-4);color:var(--bone-3);display:inline-flex;align-items:center;gap:5px}
.gate::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--bone-4)}
.gate.p{color:var(--bone-0);border-color:rgba(95,166,113,.45)}.gate.p::before{background:var(--positive)}
.gate.x{color:var(--critical-text);border-color:rgba(214,69,69,.5)}.gate.x::before{background:var(--critical)}
.gate.w{color:var(--caution);border-color:rgba(217,160,60,.45)}.gate.w::before{background:var(--caution)}
.wire{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px;background:var(--ink-0);border:1px solid var(--ink-border);padding:10px}
.wire div{border:1px dashed var(--bone-4);padding:8px;color:var(--bone-2)}
.wire .wide{grid-column:1/3}
.wire .ghost{color:var(--bone-4);border-color:var(--ink-4)}
.wire b{display:block;font-family:var(--font-display);font-weight:400;font-size:18px;color:var(--bone-0)}
.nopro{background:var(--ink-0);border:1px dashed var(--ink-4);padding:26px 14px;text-align:center;color:var(--bone-3);font-size:13px}
.prd dl{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;margin:0;font-size:13.5px}
.prd dt{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-3);padding-top:2px}
.prd dd{margin:0}
@media (max-width:640px){.prd dl{grid-template-columns:1fr}.prd dt{padding-top:6px}}
.term{background:var(--ink-0);border:1px solid var(--ink-border);padding:12px 14px;font-family:var(--font-mono);font-size:12.5px;color:var(--bone-1);display:flex;justify-content:space-between;gap:12px;align-items:center;overflow-x:auto}
.term code{white-space:pre}
.term .p{color:var(--ember-400)}
.who{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:7px 0;border-top:1px solid var(--ink-border)}
.who:first-child{border-top:0}
.who .sq,.who .dia{margin-top:6px}
.note{font-size:13px;color:var(--bone-3);min-height:1.3em}
.inst-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--ink-border);font-size:13.5px;align-items:center}
.inst-row:first-child{border-top:0}





















@media (max-width:900px){}
.intent-row{display:grid;grid-template-columns:230px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--ink-border);align-items:start}
.intent-row:first-of-type{border-top:0}
.intent-row .runs{display:flex;flex-wrap:wrap;gap:6px}
.irun{display:inline-flex;align-items:center;gap:8px;background:var(--ink-0);border:1px solid var(--ink-4);padding:5px 8px;font-family:var(--font-mono);font-size:11.5px;color:var(--bone-1);cursor:pointer}
.irun:hover{border-color:var(--bone-3)}
@media (max-width:700px){.intent-row{grid-template-columns:1fr}}
.trail{display:grid;gap:0}
.tr{display:grid;grid-template-columns:62px auto 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--ink-border);font-size:13.5px;align-items:start}
.tr:first-child{border-top:0}
.tr .d{font-family:var(--font-mono);font-size:11.5px;color:var(--bone-3);padding-top:2px}
.tr .sq,.tr .dia{margin-top:6px}
details.more summary{cursor:pointer;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-3);padding:10px 0 2px}
details.more summary:hover{color:var(--bone-0)}
.q-list{display:grid;gap:8px}
.q-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-top:1px solid var(--ink-border);padding-top:8px}
.q-item:first-child{border-top:0;padding-top:0}
@media (max-width:860px){.side }

/* ---- console additions ---- */
.prov{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;padding:1px 6px;border:1px solid var(--ink-4);color:var(--bone-3);cursor:pointer;white-space:nowrap;background:transparent;vertical-align:middle}
.prov::before{content:"";width:6px;height:6px;flex:none}
.prov.k-record::before{background:var(--bone-2);border-radius:16%}
.prov.k-executed-check::before{background:var(--positive);transform:rotate(45deg)}
.prov.k-derived::before{border:1px solid var(--bone-2)}
.prov.k-telemetry::before{background:var(--info);transform:rotate(45deg)}
.prov:hover{border-color:var(--bone-3);color:var(--bone-1)}





@media (max-width:760px){}

.gtable td{vertical-align:top}
.gstat{font-family:var(--font-mono);font-size:11.5px;white-space:nowrap}
.wf{width:100%;height:520px;border:1px solid var(--ink-4);background:#fff}
.buildnote{font-size:12px;color:var(--bone-3);border-top:1px dashed var(--ink-4);padding-top:8px}
.bt.unreached b{color:var(--bone-3)}
select.po{background:var(--ink-1);color:var(--bone-0);border:1px solid var(--ink-4);padding:6px 8px;font-family:var(--font-mono);font-size:12px;border-radius:0}
.cond-list{margin:6px 0 0;padding-left:18px;font-size:13.5px;display:grid;gap:4px}

.tr>*{min-width:0;overflow-wrap:anywhere}
@media (max-width:640px){.tr{grid-template-columns:70px auto 1fr !important}}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;background:var(--ink-2);border:1px solid var(--ink-4);padding:10px 14px;font-size:13px;color:var(--bone-1);z-index:20;max-width:80vw}

/* ---- product chrome ---- */
.envbar{background:var(--ember-500);color:var(--on-ember);font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 16px;display:flex;align-items:center;gap:8px;justify-content:center}
.envbar .dia{background:currentColor !important}
.brand{font-size:15px}
.ws{border:1px solid var(--ink-border);background:var(--ink-0);padding:9px 11px;display:grid;gap:2px}
.ws b{color:var(--bone-0);font-weight:600;font-size:14px}
.viewas{display:grid;gap:6px}
.sel{background:var(--ink-0);color:var(--bone-0);border:1px solid var(--ink-4);padding:7px 8px;font:inherit;font-size:13px;border-radius:0;width:100%}
.sel.sm{width:auto;font-family:var(--font-mono);font-size:12px;padding:4px 6px}
.side-foot{gap:4px}
.tb-r{display:flex;align-items:center;gap:10px}
.snap{display:flex;align-items:center;gap:8px}
.icon-btn{width:30px;height:30px;display:inline-grid;place-items:center;border:1px solid var(--ink-4);background:transparent;color:var(--bone-1);cursor:pointer;font-family:var(--font-mono);font-size:13px;padding:0}
.icon-btn:hover{border-color:var(--bone-3);color:var(--bone-0)}
.icon-btn svg{width:15px;height:15px}
.lnk{background:none;border:0;padding:0;color:var(--ember-300);cursor:pointer;font:inherit;font-size:13px}
.lnk:hover{text-decoration:underline}
.crumbs .lnk{font-family:var(--font-mono);font-size:12px;color:var(--bone-3)}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 16px;margin-bottom:18px}
.ph h1{font-family:var(--font-body);font-weight:600;font-size:24px;letter-spacing:-.01em;line-height:1.2}
.ph .meta{margin-top:6px;color:var(--bone-3);font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card h2,.ch h2{font-family:var(--font-body);font-weight:600;font-size:15px;color:var(--bone-0);margin:0}
.ch{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h3.sub{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-3);margin:16px 0 6px}
.card.flush{padding:0}
.t1{color:var(--bone-0);font-weight:500}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.empty{border:1px dashed var(--ink-4);background:var(--ink-1);padding:28px 16px;text-align:center;color:var(--bone-3);font-size:13px}
.empty.sm{padding:14px}
.bad-t{color:var(--critical-text)}.warn-t{color:var(--caution)}
.btn.sm{padding:5px 9px;font-size:11px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--ink-border);border:1px solid var(--ink-border);margin-bottom:16px}
.kpi{background:var(--ink-2);border:0;text-align:left;padding:14px 16px;display:grid;gap:4px;cursor:pointer;color:inherit;font:inherit;position:relative}
.kpi:hover{background:var(--ink-3)}
.kpi .v{font-size:28px;font-weight:600;color:var(--bone-0);line-height:1.1}
.kpi .v small{font-size:15px;color:var(--bone-3);font-weight:500}
.kpi.bad{box-shadow:inset 0 2px 0 var(--critical)}.kpi.bad .v{color:var(--critical-text)}
.kpi.warn{box-shadow:inset 0 2px 0 var(--caution)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}}
/* tabs, segmented, search */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--ink-border);margin:0 0 16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;color:var(--bone-2);cursor:pointer;font:inherit;font-size:13.5px;white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--bone-0)}
.tabs button[aria-selected="true"]{color:var(--bone-0);border-bottom-color:var(--ember-500)}
.tabs .ct,.ph2 .ct{font-family:var(--font-mono);font-size:11px;color:var(--bone-3);margin-left:4px}
.bigtrack-wrap+.tabs{margin-top:16px}
.segctl{display:inline-flex;border:1px solid var(--ink-4)}
.segctl button{background:none;border:0;padding:6px 12px;cursor:pointer;color:var(--bone-2);font:inherit;font-size:13px}
.segctl button[aria-pressed="true"]{background:var(--ink-3);color:var(--bone-0)}
.search{background:var(--ink-0);color:var(--bone-0);border:1px solid var(--ink-4);padding:7px 10px;font:inherit;font-size:13px;min-width:200px;border-radius:0}
.search:focus{outline:2px solid var(--ember-400);outline-offset:-1px}
/* gate strip */
.gstrip{display:inline-flex;gap:2px}
.gstrip i{width:10px;height:14px;background:var(--ink-4)}
.gstrip i.p{background:var(--positive)}.gstrip i.x{background:var(--critical)}.gstrip i.w{background:var(--caution);opacity:.55}
/* inbox */
table.inbox td:first-child{width:22px;padding-right:0}
table.inbox td{vertical-align:top}
table.inbox .dia{margin-top:6px}
/* maturity */
.segbar{display:flex;height:10px;gap:2px;background:var(--ink-3)}
.segbar span{min-width:0}
.seglegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--bone-2)}
.seglegend span{display:inline-flex;align-items:center;gap:6px;text-transform:capitalize}
.seglegend i{width:9px;height:9px;display:inline-block}
.seglegend b{color:var(--bone-0);font-weight:600}
.lv-absent{background:var(--critical)}.lv-defined{background:var(--caution)}.lv-mechanically-validated{background:var(--positive)}.lv-platform-enforced{background:var(--info)}.lv-organisationally-enforced{background:var(--ember-500)}
/* pipeline */
.ph2{display:grid;gap:1px}
.ph2 b{font-weight:600;font-size:13.5px;color:var(--bone-0)}
.pipe>div{min-height:120px}
.pcard{gap:5px}
.intent-row{grid-template-columns:1fr auto;font-size:13.5px}
@media (max-width:700px){.intent-row{grid-template-columns:1fr}}
/* props */
dl.props{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;margin:0;font-size:13.5px}
dl.props.wide{grid-template-columns:140px 1fr}
dl.props dt{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-3);padding-top:3px}
dl.props dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:640px){dl.props,dl.props.wide{grid-template-columns:1fr}dl.props dt{padding-top:6px}}
.card.next{box-shadow:inset 2px 0 0 var(--ember-500)}
.bt b{font-family:var(--font-body);font-weight:600;font-size:14px}
.run-h h1{font-size:26px}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--ink-1);border-left:1px solid var(--ink-4);box-shadow:var(--shadow);z-index:30;overflow-y:auto;padding:0 20px 40px}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--ink-border);position:sticky;top:0;background:var(--ink-1)}
.drawer section{padding:16px 0;border-bottom:1px solid var(--ink-border);display:grid;gap:6px}
.drawer h3{font-family:var(--font-body);font-weight:600;font-size:15px}
.drawer h4{font-family:var(--font-mono);font-weight:400;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-3);margin:10px 0 2px}
.drawer p{font-size:13.5px}
.hq{display:grid;gap:2px;text-align:left;background:var(--ink-2);border:1px solid var(--ink-border);padding:8px 10px;cursor:pointer;color:var(--bone-0);font:inherit;font-size:13.5px}
.hq:hover{border-color:var(--bone-3)}
@media (max-width:860px){.ws{display:none}.viewas{grid-template-columns:auto 1fr auto;align-items:center}.tb-r .snap .cap{display:none}}
.ilist{display:grid}
.it{display:grid;grid-template-columns:12px minmax(0,1fr) minmax(0,160px);gap:10px;align-items:start;text-align:left;background:none;border:0;border-top:1px solid var(--ink-border);padding:10px 4px;color:inherit;font:inherit;font-size:13.5px;cursor:pointer;width:100%}
.it:first-child{border-top:0}
.it:hover{background:var(--ink-3)}
.it .dia{margin-top:6px}
.it-m{min-width:0}
.it-d{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.it-o{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.it{grid-template-columns:12px minmax(0,1fr)}.it-o{display:none}}
.intent-row{grid-template-columns:1fr !important;gap:6px}
.stack>*{min-width:0}.term code{min-width:0;overflow-x:auto}.g-7-5>.stack{align-content:start}.g-7-5>.stack>.card{align-self:start}
@media (max-width:860px){.side-foot{display:none}.topbar{flex-wrap:nowrap}}
td.mono,td .mono,td.nowrap{white-space:nowrap}
table.inbox{table-layout:fixed;min-width:760px}table.inbox td{overflow-wrap:anywhere}table.inbox td.own{font-size:13px}table.inbox td:last-child .prov{max-width:100%;overflow:hidden;text-overflow:ellipsis}

ver the harness","state":"defined","owner_role":"accountable-executive","note":null},{"id":"HG-0011","objective":"Residency-controlled model traffic, pre-egress DLP, attested execution","state":"defined","owner_role":"security","note":null},{"id":"MRM-FN","objective":"An organisationally-separate model-risk function owning validation and runtime monitoring","state":"defined","owner_role":"model-risk","note":null},{"id":"AI-INCIDENT","objective":"A rehearsed response path for a deployed model that harms: detection off the runtime metrics the model manifest already declares, suspension held by the model-risk function, customer notification, remediation, and purification where the harm generated income","state":"defined","owner_role":"model-risk","note":"Moves bank-grade-gap cluster B's 'AI incident runbook' from Absent to Defined, and no further. THE HARNESS HOLDS NO INCIDENT DETECTION — it reads records: a manifest that DECLARES which metrics are monitored, a log that RECORDS a signal somebody else wrote, a purification record that STATES an amount left. Nothing here watches a live model, evaluates a production output, pages a human or moves money, so a period with no incident record is uncovered here, not clean. Each mechanical step in the runbook is gated by a control that already exists (HG-0006, OPS-LOOP, PURIFICATION, ASSURANCE-CYCLE, HG-0003); this row is the organisational path they hang on, and running it is the adopter's. The runtime-guardrails provider role (adapters/providers/runtime-guardrails/) names the enforcement point that would produce the denials this path assumes — selecting one does not change this grade"},{"id":"2L-CHALLENGE","objective":"An independent second-line challenge FUNCTION (people, mandate, veto)","state":"absent","owner_role":"risk-second-line","note":"The release-hold MECHANISM ships (RELEASE-HOLD); the organisationally-separate function operating it is the adopter's — organisationally-enforced is theirs to claim. See docs/governanc const STAGE_GATES={'1':['D2'],'2':['D5'],'3':['D1','D3','D4'],'4':['D6'],'5':['D7','D8'],'5b':['D9'],'6':[]};

const fmtStamp=s=>{const d=new Date(s);return isNaN(d)?esc(s):d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'})+', '+d.toISOString().slice(11,16)+' UTC';};
const daysTo=s=>Math.round((Date.parse(s)-NOW)/86400000);

/* stage cell state, from the validator and the artifacts, nothing else */
function stageState(r,sid,art){
 const has=!!r.artifacts[art];
 const gs=STAGE_GATES[sid].map(id=>gate(r,id)).filter(Boolean);
 if(r.status==='stopped'&&!has)return 's';
 if(!has)return r.stage.id===sid?'c':'t';
 if(gs.some(g=>g.status==='fail'&&g.reached))return 'f';
 if(gs.some(g=>g.status==='fail'))return 'c';
 return 'd';
}

 for(const [k,rows] of Object.entries(byChange)){const x=rows[0];const br=rows.filter(y=>y.breached).length;const nobody=rows.filter(y=>!y.holders.length).map(y=>y.role);

 const pend=D.registers.obligations.filter(o=>o.article_status==='owner-verification-pending');
 if(pend.length)A.push({sev:'cau',kind:'Obligation',t:`${pend.length} obligations pending owner verification`,subj:'obligations register',b:esc(pend.map(o=>o.id).join(' · ')),o:[...new Set(pend.map(o=>o.owner_role))].join(', '),roles:['risk','context','audit'],src:D.registers.obligations_source,go:'data-go="context:obligations"'});

 return A;

function nextStep(r){
 const v=`node discovery/gates/validate.mjs discovery/runs/${r.slug}`;
 if(r.status==='stopped')return {t:'None · stopped',b:`Stopped by ${pname(r.outcome?.decided_by)} on ${fmtDate(r.outcome?.decided_at)}.`,cmds:[],skill:null};
 if(r.status==='handed-off')return {t:'Develop',b:'Validate, then explore at least three solution directions against the hand-off.',cmds:[v],skill:'develop'};
 if(r.status==='gate-failing'){const g=gate(r,r.blocked_by[0]);return {t:`Fix ${g.id} ${g.name}`,b:g.issues.join('; '),cmds:[v],skill:'discovery'};}
 if(r.status==='awaiting-reaction')return {t:'Record reaction',b:`Verdicts on ${r.hypotheses.map(h=>h.id).join(', ')} from the named roles, bound to the prototype digest.`,cmds:[`${v} --prototype-digest`,v],skill:'discovery'};
 const what={'1':'Gather signals','2':'Write the synthesis','3':'Frame the problem','4':'Data-governance feasibility','5':'Build the prototype'}[r.stage.id]||`Stage ${r.stage.id}`;
 return {t:what,b:'',cmds:[v],skill:'discovery'};
}

 const R=ROLES[role];
 const go=t=>{if(t==='run:first'){const r=runs.find(x=>x.sponsor?.id===poId)||runs[0];return `data-run="${r.slug}"`;}if(t==='run:blocked'){const r=byStatus('gate-failing')[0]||runs[0];return `data-run="${r.slug}" data-tab="gates"`;}if(t==='run:model'){const r=runs.find(x=>x.product_profile?.id==='ai-decision-system')||runs[0];return `data-run="${r.slug}"`;}if(t.startsWith('run:'))return `data-run="${t.slice(4)}"`;return `data-go="${t}"`;};
 const people=R.reg.map(rg=>{const hs=holders(rg);return `<div class="kv"><div class="l"><span class="mono">${rg}<\/span><\/div><span class="cap">${hs.length?hs.map(h=>esc(pname(h.id))).join(', '):'unheld'}<\/span><\/div>`;}).join('');
 const cc=D.control_catalog;
 return `<div class="dh"><b>Help<\/b><button class="icon-btn" data-help="close" aria-label="Close help">×<\/button><\/div>
 ${role!=='all'?`<section><h3>${esc(R.label)}<\/h3>
  ${people||'<p class="cap">No registry role maps to this view.<\/p>'}
  <h4>Where to look<\/h4>${R.guide.map(q=>`<button class="hq" ${go(q[2])}><span>${esc(q[0])}<\/span><span class="cap">${esc(q[1])} →<\/span><\/button>`).join('')}
  <h4>Where you decide<\/h4><p>${R.hg&&HG[R.hg]?`<span class="mono">${R.hg}<\/span> ${esc(HG[R.hg].objective.split(/[;:]/)[0])} ${stBadge(HG[R.hg].state)}<br><span class="cap">Signed records in git, merged by a second person. The console is read-only.<\/span>`:esc(R.decide||'')}<\/p>
  <h4>Not in the console<\/h4><p class="cap">${esc(R.gap)}<\/p><\/section>`:''}
 <section><h3>This page<\/h3><p class="cap">${PAGE_HELP[curView]||''}<\/p><\/section>
 <section><h3>Source tags<\/h3>${['record','executed-check','derived','telemetry'].map(k=>`<div class="kv"><div class="l"><span><span class="prov k-${k}" style="cursor:default">${KLABEL[k]}<\/span><\/span><\/div><span class="cap">${{record:'a file in the repository',"executed-check":'a check run at snapshot time',derived:'computed by the console',telemetry:'ages and SLAs; never blocks'}[k]}<\/span><\/div>`).join('')}<p class="cap" style="margin-top:6px">Click any tag to copy its path.<\/p><\/section>
 <section><h3>Control maturity<\/h3><p class="cap">${cc.ladder.map(s=>esc(s)).join(' → ')}. A control moves right only when evidence of enforcement is recorded. Platform and organisational enforcement belong to the institution; the Loom is a build-time frame.<\/p><\/section>
 <section><h3>Snapshot<\/h3><dl class="props"><dt>Generated<\/dt><dd>${fmtStamp(D.generated_at)}<\/dd><dt>By<\/dt><dd class="mono">${esc(D.generator)}<\/dd><dt>Schema<\/dt><dd class="mono">${esc(D.schema)}<\/dd><dt>Commit<\/dt><dd class="mono">${D.repository.commit?esc(D.repository.commit.slice(0,7)):'—'}<\/dd><dt>Authority<\/dt><dd class="mono">${esc(D.authority)}<\/dd><\/dl>${D.repository.commit?'':`<p class="cap" style="margin-top:6px">${esc(D.repository.note)}<\/p>`}${BUILD?`<p class="cap" style="margin-top:6px">${esc(BUILD)}<\/p>`:''}<\/section>`;
}

/* ================= CHROME + ROUTER ================= */
/* ---------- theme: light / dark, following the system until the viewer picks ---------- */
const SUN='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3"/><\/svg>';
const MOON='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/><\/svg>';
const sysLight=()=>globalThis.matchMedia?.('(prefers-color-scheme: light)').matches;
let theme=null;try{theme=localStorage.getItem('loom-theme');}catch(e){}
const hostTheme=document.documentElement.dataset.theme||null;
const effTheme=()=>theme||hostTheme||(sysLight()?'light':'dark');
function applyTheme(){if(theme)document.documentElement.dataset.theme=theme;const b=$('#themeBtn');if(b){b.innerHTML=effTheme()==='dark'?SUN:MOON;b.title=effTheme()==='dark'?'Switch to light':'Switch to dark';}}
applyTheme();
$('#themeBtn').addEventListener('click',()=>{theme=effTheme()==='dark'?'light':'dark';try{localStorage.setItem('loom-theme',theme)}catch(e){}applyTheme();});
globalThis.matchMedia?.('(prefers-color-scheme: light)').addEventListener?.('change',applyTheme);

const synth=runs.filter(r=>r.synthetic).length;
if(synth){const eb=$('#envbar');eb.hidden=false;eb.innerHTML=`<span class="dia" style="background:#110D0A"><\/span>Synthetic data · ${synth} of ${runs.length} runs · ${esc(INST)}`;}
$('#ws').innerHTML=`<b>${esc(INST)}<\/b><span class="cap mono">loom ${esc(D.installation.bundle_version||'—')} · ${esc(D.installation.tier||'—')}<\/span>`;
$('#runCount').textContent=runs.length;
$('#snap').innerHTML=`<span class="badge b-none">read-only<\/span> <span class="cap">Snapshot ${fmtStamp(D.generated_at)}<\/span>`;
$('#sideFoot').innerHTML=`<span class="cap mono">${esc(D.schema)}<\/span>${D.repository.commit?`<span class="cap mono">@ ${esc(D.repository.commit.slice(0,7))}<\/span>`:''}`;
$('#roleSel').innerHTML=Object.entries(ROLES).map(([k,R])=>`<option value="${k}">${esc(R.label)}<\/option>`).join('');
function renderChrome(){
 $('#roleSel').value=role;
 $('#poWrap').innerHTML=ROLES[role].owner?`<select class="sel sm" id="poPick" aria-label="Product owner">${POS.map(p=>`<option value="${p}" ${p===poId?'selected':''}>${esc(pname(p))}<\/option>`).join('')}<\/select>`:'';
 $('#inboxCount').textContent=mine().length;
 const h=$('#help');h.hidden=!helpOpen;$('#helpBtn').setAttribute('aria-expanded',String(helpOpen));if(helpOpen)h.innerHTML=helpHtml();
}
const CRUMB={overview:'Overview',inbox:'Inbox',runs:'Runs',context:'Context',install:'Installation'};
function render(v){
 if(v&&v.startsWith('context:')){ctxTab=v.slice(8);v='context';}
 if(!VIEWS[v])v='overview';curView=v;
 document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',(b.dataset.v===v||(v==='run'&&b.dataset.v==='runs'))?'page':'false'));
 $('#view').innerHTML=VIEWS[v]();
 renderChrome();
 $('#crumbs').innerHTML=esc(INST)+' / '+(v==='run'?`<button class="lnk" data-v="runs">Runs<\/button> / <b>${esc(curRun)}<\/b>`:`<b>${CRUMB[v]}<\/b>`);
 try{history.replaceState(null,'','#'+(v==='run'?'run-'+curRun:v))}catch(e){}
 const pick=$('#runPick');if(pick)pick.addEventListener('change',e=>{curRun=e.target.value;runTab='summary';render('run')});
 const q=$('#q');if(q)q.addEventListener('input',()=>{const t=q.value.trim().toLowerCase();document.querySelectorAll('#runTable tbody tr').forEach(tr=>{tr.hidden=!!t&&!tr.dataset.s.includes(t);});});
 window.scrollTo(0,0);
}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{el.hidden=true},2600);}
function setRole(k){role=k;showAll=false;runFilter='all';sevFilter='all';try{localStorage.setItem('loom-role',role)}catch(err){}render(ROLES[role].home);}
$('#roleSel').addEventListener('change',e=>setRole(e.target.value));
$('#poWrap').addEventListener('change',e=>{if(e.target.id==='poPick'){poId=e.target.value;try{localStorage.setItem('loom-po',poId)}catch(err){}render(curView==='run'?'runs':curView);}});
$('#helpBtn').addEventListener('click',()=>{helpOpen=!helpOpen;renderChrome();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&helpOpen){helpOpen=false;renderChrome();}});
document.addEventListener('click',e=>{
 const c=e.target.closest('[data-copy]');if(c){e.stopPropagation();const t=c.dataset.copy;try{navigator.clipboard.writeText(t).then(()=>toast('Copied '+t),()=>toast(t));}catch(err){toast(t);}return;}
 if(e.target.closest('[data-help="close"]')){helpOpen=false;renderChrome();return;}
 const rs=e.target.closest('[data-role-set]');if(rs){setRole(rs.dataset.roleSet);return;}
 const ow=e.target.closest('[data-owners]');if(ow){showAll=ow.dataset.owners==='all';render('runs');return;}
 const sv=e.target.closest('[data-sev]');if(sv){sevFilter=sv.dataset.sev;render('inbox');return;}
 const cx=e.target.closest('[data-ctx]');if(cx){ctxTab=cx.dataset.ctx;render('context');return;}
 const f=e.target.closest('[data-filter]');if(f){runFilter=f.dataset.filter;render('runs');return;}
 const r=e.target.closest('[data-run]');if(r){curRun=r.dataset.run;runTab=r.dataset.tab||'summary';render('run');return;}
 const tb=e.target.closest('[data-tab]');if(tb){runTab=tb.dataset.tab;render('run');return;}
 const n=e.target.closest('[data-v]');if(n){render(n.dataset.v);return;}
 const g=e.target.closest('[data-go]');if(g){render(g.dataset.go);return;}
});
function fromHash(){let h=(location.hash||'').slice(1);if(h.startsWith('as-')&&ROLES[h.slice(3)]){role=h.slice(3);h=ROLES[role].home;}if(h.startsWith('run-')){const s=h.slice(4);if(runs.some(r=>r.slug===s)){if(s!==curRun)runTab='summary';curRun=s;h='run';}}render(h||'overview');}
window.addEventListener('hashchange',fromHash);
fromHash();

</script>

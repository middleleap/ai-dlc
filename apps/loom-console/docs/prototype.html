<title>Loom Oversight Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* The Loom console — styles. No external fonts: the app makes no network call; the faces fall back
   to the system stack when Instrument Serif, DM Sans and JetBrains Mono are not installed. */
:root{
  color-scheme:dark;
  --ink-0:#080808;--ink-1:#101010;--ink-2:#181817;--ink-3:#232321;--ink-4:#33322F;--ink-border:#1E1E1C;
  --bone-0:#ECE9E1;--bone-1:#DEDBD4;--bone-2:#A8A59E;--bone-3:#87847D;--bone-4:#4A4945;
  --ember-300:#F58F55;--ember-400:#F0722E;--ember-500:#E65C2D;--ember-dim:rgba(230,92,45,.14);
  --positive:#5FA671;--positive-dim:rgba(95,166,113,.14);
  --caution:#D9A03C;--caution-dim:rgba(217,160,60,.14);
  --critical:#D64545;--critical-text:#E06060;--critical-dim:rgba(214,69,69,.14);
  --info:#5D8FA6;--info-text:#8DB6C9;--info-dim:rgba(93,143,166,.14);
  --font-display:'Instrument Serif',Georgia,serif;
  --font-body:'DM Sans',Arial,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --dur-base:200ms;--dur-leap:400ms;--ease-leap:cubic-bezier(.34,1.3,.4,1);
}
@media (prefers-reduced-motion:reduce){:root{--dur-base:.01ms;--dur-leap:.01ms}}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink-0);color:var(--bone-1);font-family:var(--font-body);font-size:15px;line-height:1.55;margin:0}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:400;color:var(--bone-0);margin:0;line-height:1.15;text-wrap:balance}
h1 em,h2 em{font-style:italic;color:var(--ember-500)}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--ember-300)}
:focus-visible{outline:2px solid var(--ember-400);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.label{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-3)}
.cap{font-size:12.5px;color:var(--bone-3)}
.muted{color:var(--bone-2)}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{border-right:1px solid var(--ink-border);background:var(--ink-1);padding:20px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.02em;font-size:16px;color:var(--bone-1)}
.brand b{color:var(--ember-500);font-weight:600}
.product{font-family:var(--font-display);font-size:22px;color:var(--bone-0);line-height:1.1}
.product em{font-style:italic;color:var(--ember-500)}
.inst{border:1px solid var(--ink-border);background:var(--ink-0);padding:10px 12px;display:grid;gap:2px}
.inst b{color:var(--bone-0);font-weight:600;font-size:14px}
.nav{display:grid;gap:2px}
.nav button{background:none;border:0;text-align:left;padding:9px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--bone-2);font-size:14px;border-left:2px solid transparent}
.nav button:hover{background:var(--ink-2);color:var(--bone-0)}
.nav button[aria-current="page"]{background:var(--ink-2);color:var(--bone-0);border-left-color:var(--ember-500)}
.nav .ct{font-family:var(--font-mono);font-size:11px;color:var(--bone-3)}
.side-foot{margin-top:auto;display:grid;gap:8px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:12px 28px;border-bottom:1px solid var(--ink-border);background:var(--ink-0);position:sticky;top:env(safe-area-inset-top,0px);z-index:4}
.crumbs{font-family:var(--font-mono);font-size:12px;color:var(--bone-3)}
.crumbs b{color:var(--bone-0);font-weight:500}
.view{padding:28px 28px 72px;max-width:1240px;width:100%}
.vh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}
.vh h1{font-size:clamp(30px,3.4vw,40px)}
.vh p{color:var(--bone-2);max-width:62ch;margin-top:8px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--ink-border);padding:14px 16px;gap:12px}
  .nav{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto}
  .nav button{border-left:0;border-bottom:2px solid transparent}
  .nav button[aria-current="page"]{border-bottom-color:var(--ember-500)}
  .side-foot,.side .inst{display:none}
  .topbar{padding:10px 16px;position:static}
  .view{padding:20px 16px 56px}
}

/* primitives */
.badge{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:2px;letter-spacing:.03em;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:currentColor;flex:none}
.b-pos{background:var(--positive-dim);color:var(--positive)}
.b-cau{background:var(--caution-dim);color:var(--caution)}
.b-crit{background:var(--critical-dim);color:var(--critical-text)}
.b-info{background:var(--info-dim);color:var(--info-text)}
.b-ember{background:var(--ember-dim);color:var(--ember-300)}
.b-none{background:var(--ink-3);color:var(--bone-2)}
.card{border:1px solid var(--ink-border);background:var(--ink-2);padding:18px}
.card h3{font-size:22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-7-5{grid-template-columns:7fr 5fr}
@media (max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}.g-7-5{grid-template-columns:1fr}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.grid>*{min-width:0}
.stat{border:1px solid var(--ink-border);background:var(--ink-1);padding:16px 18px;display:grid;gap:6px;align-content:start}
.stat .big{font-family:var(--font-display);font-size:40px;line-height:1;color:var(--bone-0)}
.stat .big small{font-size:20px;color:var(--bone-3)}
.bar{display:flex;height:6px;background:var(--ink-3);gap:2px}
.bar span{display:block;height:100%}
.tbl-wrap{overflow-x:auto;border:1px solid var(--ink-border)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-3);font-weight:400;text-align:left;padding:10px 12px;border-bottom:1px solid var(--ink-4);background:var(--ink-1);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--ink-border);vertical-align:middle;background:var(--ink-2)}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--ink-3)}
.file{font-family:var(--font-mono);font-size:12px;color:var(--bone-0);background:var(--ink-0);border:1px solid var(--ink-border);padding:1px 6px;white-space:nowrap}
.btn{font-family:var(--font-mono);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:10px 14px;border:1px solid var(--ink-4);background:transparent;color:var(--bone-1);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color var(--dur-base),background var(--dur-base)}
.btn:hover{border-color:var(--bone-3)}
.btn-p{background:var(--ember-500);border-color:var(--ember-500);color:#110D0A}
.btn-p::before{content:"";width:8px;height:8px;background:currentColor;transition:transform var(--dur-leap) var(--ease-leap)}
.btn-p:hover{background:var(--ember-400);border-color:var(--ember-400)}
.btn-p:hover::before{transform:rotate(45deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-mono);font-size:11.5px;padding:3px 8px;border-radius:2px;background:var(--ink-3);color:var(--bone-1);border:1px solid transparent;cursor:default}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--bone-3)}
button.chip[aria-pressed="true"]{border-color:var(--ember-500);background:var(--ember-dim);color:var(--bone-0)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{justify-content:space-between}
.stack{display:grid;gap:10px}
.dia{display:inline-block;width:8px;height:8px;transform:rotate(45deg);flex:none}
.sq{display:inline-block;width:9px;height:9px;border-radius:16%;flex:none}
.tag-src{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em;padding:2px 6px;border:1px dashed var(--bone-4);color:var(--bone-3);border-radius:2px;white-space:nowrap}

/* stage track (mini) */
.track{display:inline-flex;align-items:center;gap:3px}
.track i{display:block;width:12px;height:12px;border:1.5px solid var(--bone-4);border-radius:16%}
.track i.d{background:var(--bone-2);border-color:var(--bone-2)}
.track i.c{background:var(--ember-500);border-color:var(--ember-500);transform:rotate(45deg) scale(.86)}
.track i.f{background:var(--critical);border-color:var(--critical);transform:rotate(45deg) scale(.86)}
.track i.s{border-color:var(--bone-3);background:repeating-linear-gradient(45deg,var(--bone-4) 0 2px,transparent 2px 4px)}
.track b{width:1px;height:14px;background:var(--ember-500);margin:0 3px}
.track i.r{border-style:dashed}

/* attention */
.att{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--ink-border)}
.att:first-child{border-top:0;padding-top:0}
.att .dia{margin-top:7px}
.att b{color:var(--bone-0);font-weight:600}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(8,1fr);border:1px solid var(--ink-border)}
.pipe>div{padding:12px 10px;border-right:1px solid var(--ink-border);display:grid;gap:8px;align-content:start;min-height:150px;background:var(--ink-1)}
.pipe>div:last-child{border-right:0}
.pipe .ph{display:grid;gap:2px}
.pipe .ph b{font-family:var(--font-display);font-weight:400;font-size:17px;color:var(--bone-0);line-height:1.15}
.pipe .waist{background:var(--ink-2);box-shadow:inset 2px 0 0 var(--ember-500)}
.pcard{background:var(--ink-2);border:1px solid var(--ink-4);padding:7px 8px;font-size:12px;cursor:pointer;text-align:left;display:grid;gap:3px;color:var(--bone-1);width:100%}
.pcard:hover{border-color:var(--bone-3)}
.pcard .mono{font-size:11px}
.pipe-wrap{overflow-x:auto}
.pipe-wrap .pipe{min-width:900px}

/* brain */
.dim{border:1px solid var(--ink-border);background:var(--ink-1)}
.dim-h{padding:18px;border-bottom:1px solid var(--ink-border);display:grid;gap:6px}
.dim-h h3{font-size:24px}
.dim-b{padding:6px 18px 16px}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--ink-border);font-size:13.5px}
.kv:first-child{border-top:0}
.kv .l{display:grid;gap:1px;min-width:0}
.kv .l span:first-child{color:var(--bone-0)}
.dig{font-family:var(--font-mono);font-size:11px;color:var(--bone-3)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.cell{display:inline-block;width:12px;height:12px;border-radius:16%}
.cell.y{background:var(--bone-2)}
.cell.w{background:var(--caution);transform:rotate(45deg) scale(.8)}
.cell.n{border:1px solid var(--bone-4)}

/* run detail */
.bigtrack{display:grid;grid-template-columns:repeat(7,1fr) 1.3fr;border:1px solid var(--ink-border)}
.bt{padding:14px 12px;border-right:1px solid var(--ink-border);display:grid;gap:6px;align-content:start;background:var(--ink-1);position:relative}
.bt:last-child{border-right:0}
.bt .n{font-family:var(--font-mono);font-size:11px;color:var(--bone-3)}
.bt b{font-family:var(--font-display);font-weight:400;font-size:18px;color:var(--bone-0);line-height:1.1}
.bt .f{font-family:var(--font-mono);font-size:10.5px;color:var(--bone-2);word-break:break-all}
.bt.done{background:var(--ink-2)}
.bt.cur{background:var(--ember-dim);box-shadow:inset 0 2px 0 var(--ember-500)}
.bt.fail{background:var(--critical-dim);box-shadow:inset 0 2px 0 var(--critical)}
.bt.stop{background:var(--ink-2);box-shadow:inset 0 2px 0 var(--bone-3)}
.bt.todo b{color:var(--bone-3)}
.bt.right{background:var(--ink-0)}
.bigtrack-wrap{overflow-x:auto}
.bigtrack-wrap .bigtrack{min-width:900px}
.gates{display:flex;flex-wrap:wrap;gap:5px}
.gate{font-family:var(--font-mono);font-size:11px;padding:3px 7px;border:1px solid var(--ink-4);color:var(--bone-3);display:inline-flex;align-items:center;gap:5px}
.gate::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--bone-4)}
.gate.p{color:var(--bone-0);border-color:rgba(95,166,113,.45)}.gate.p::before{background:var(--positive)}
.gate.x{color:var(--critical-text);border-color:rgba(214,69,69,.5)}.gate.x::before{background:var(--critical)}
.gate.w{color:var(--caution);border-color:rgba(217,160,60,.45)}.gate.w::before{background:var(--caution)}
.wire{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px;background:var(--ink-0);border:1px solid var(--ink-border);padding:10px}
.wire div{border:1px dashed var(--bone-4);padding:8px;color:var(--bone-2)}
.wire .wide{grid-column:1/3}
.wire .ghost{color:var(--bone-4);border-color:var(--ink-4)}
.wire b{display:block;font-family:var(--font-display);font-weight:400;font-size:18px;color:var(--bone-0)}
.nopro{background:var(--ink-0);border:1px dashed var(--ink-4);padding:26px 14px;text-align:center;color:var(--bone-3);font-size:13px}
.prd dl{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;margin:0;font-size:13.5px}
.prd dt{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-3);padding-top:2px}
.prd dd{margin:0}
@media (max-width:640px){.prd dl{grid-template-columns:1fr}.prd dt{padding-top:6px}}
.term{background:var(--ink-0);border:1px solid var(--ink-border);padding:12px 14px;font-family:var(--font-mono);font-size:12.5px;color:var(--bone-1);display:flex;justify-content:space-between;gap:12px;align-items:center;overflow-x:auto}
.term code{white-space:pre}
.term .p{color:var(--ember-400)}
.who{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:7px 0;border-top:1px solid var(--ink-border)}
.who:first-child{border-top:0}
.who .sq,.who .dia{margin-top:6px}
.note{font-size:13px;color:var(--bone-3);min-height:1.3em}
.inst-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--ink-border);font-size:13.5px;align-items:center}
.inst-row:first-child{border-top:0}

/* role lens */
.roles{display:grid;gap:4px}
.roles .rl{background:none;border:1px solid transparent;text-align:left;padding:7px 10px;cursor:pointer;display:grid;gap:1px;color:var(--bone-2)}
.roles .rl b{font-weight:600;font-size:13.5px;color:var(--bone-1)}
.roles .rl span{font-size:11.5px;color:var(--bone-3);line-height:1.35}
.roles .rl:hover{background:var(--ink-2)}
.roles .rl[aria-pressed="true"]{border-color:var(--ember-500);background:var(--ember-dim)}
.roles .rl[aria-pressed="true"] b{color:var(--bone-0)}
.nav .fy{width:7px;height:7px;background:var(--ember-500);transform:rotate(45deg);display:inline-block;margin-left:auto;margin-right:6px}
.lens [data-for]{transition:opacity var(--dur-base)}
.lens [data-for]:not(.for-me){opacity:.42}
.lens [data-for]:not(.for-me):hover{opacity:1}
.lens .for-me{position:relative;outline:1px solid rgba(230,92,45,.55);outline-offset:-1px}
.lens .for-me::after{content:"for you";position:absolute;top:-9px;right:12px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--ember-500);color:#110D0A;padding:1px 7px;z-index:2}
.banner{border:1px solid var(--ember-500);background:linear-gradient(0deg,var(--ember-dim),var(--ember-dim)),var(--ink-1);padding:18px 20px;margin-bottom:22px;display:grid;grid-template-columns:1.1fr 1.6fr;gap:22px}
.banner h2{font-size:28px}
.banner .qs{display:grid;gap:8px}
.banner .q{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--ink-0);border:1px solid var(--ink-border);padding:9px 12px;font-size:14px;color:var(--bone-0)}
.banner .q .btn{padding:6px 10px;font-size:11px}
.banner .gap{font-size:13px;color:var(--bone-2);border-top:1px solid rgba(230,92,45,.3);padding-top:10px;margin-top:4px}
@media (max-width:900px){.banner{grid-template-columns:1fr}}
.intent-row{display:grid;grid-template-columns:230px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--ink-border);align-items:start}
.intent-row:first-of-type{border-top:0}
.intent-row .runs{display:flex;flex-wrap:wrap;gap:6px}
.irun{display:inline-flex;align-items:center;gap:8px;background:var(--ink-0);border:1px solid var(--ink-4);padding:5px 8px;font-family:var(--font-mono);font-size:11.5px;color:var(--bone-1);cursor:pointer}
.irun:hover{border-color:var(--bone-3)}
@media (max-width:700px){.intent-row{grid-template-columns:1fr}}
.trail{display:grid;gap:0}
.tr{display:grid;grid-template-columns:62px auto 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--ink-border);font-size:13.5px;align-items:start}
.tr:first-child{border-top:0}
.tr .d{font-family:var(--font-mono);font-size:11.5px;color:var(--bone-3);padding-top:2px}
.tr .sq,.tr .dia{margin-top:6px}
details.more summary{cursor:pointer;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-3);padding:10px 0 2px}
details.more summary:hover{color:var(--bone-0)}
.q-list{display:grid;gap:8px}
.q-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-top:1px solid var(--ink-border);padding-top:8px}
.q-item:first-child{border-top:0;padding-top:0}
@media (max-width:860px){.roles{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto}.roles .rl span{display:none}.side .roles-h{display:none}}

/* ---- console additions ---- */
.prov{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;padding:1px 6px;border:1px solid var(--ink-4);color:var(--bone-3);cursor:pointer;white-space:nowrap;background:transparent;vertical-align:middle}
.prov::before{content:"";width:6px;height:6px;flex:none}
.prov.k-record::before{background:var(--bone-2);border-radius:16%}
.prov.k-executed-check::before{background:var(--positive);transform:rotate(45deg)}
.prov.k-derived::before{border:1px solid var(--bone-2)}
.prov.k-telemetry::before{background:var(--info);transform:rotate(45deg)}
.prov:hover{border-color:var(--bone-3);color:var(--bone-1)}
.legend-k{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:10px}
.ladder div{padding:10px;background:var(--ink-0);border:1px solid var(--ink-border);display:grid;gap:4px}
.ladder b{font-family:var(--font-display);font-weight:400;font-size:30px;color:var(--bone-0);line-height:1}
.ladder .z b{color:var(--bone-4)}
@media (max-width:760px){.ladder{grid-template-columns:1fr 1fr}}
.honest{border:1px solid var(--ink-4);background:var(--ink-1);padding:16px 18px;margin-bottom:16px}
.gtable td{vertical-align:top}
.gstat{font-family:var(--font-mono);font-size:11.5px;white-space:nowrap}
.wf{width:100%;height:520px;border:1px solid var(--ink-4);background:#fff}
.buildnote{font-size:12px;color:var(--bone-3);border-top:1px dashed var(--ink-4);padding-top:8px}
.bt.unreached b{color:var(--bone-3)}
select.po{background:var(--ink-1);color:var(--bone-0);border:1px solid var(--ink-4);padding:6px 8px;font-family:var(--font-mono);font-size:12px;border-radius:0}
.cond-list{margin:6px 0 0;padding-left:18px;font-size:13.5px;display:grid;gap:4px}
.banner>*{min-width:0;overflow-wrap:anywhere}

/* ---------- attention: every item is computed from the data; nothing is typed in ---------- */
function attention(){
 const A=[];
 for(const r of byStatus('gate-failing'))for(const id of r.blocked_by){const g=gate(r,id);A.push({sev:'crit',t:`${r.slug} fails ${id} ${g.name}.`,b:esc(g.issues[0]||''),o:dn(r.sponsor?.id),roles:['programme','facilitator',...(r.sponsor?.id===poId?['product']:[])],sponsor:r.sponsor?.id,src:r.gates_source,btn:['Open run',`data-run="${r.slug}"`]});}
 for(const r of runs.filter(x=>x.status!=='stopped'))for(const u of (r.data_governance?.uncovered||[]))A.push({sev:'crit',t:`Uncovered risk in ${r.slug}.`,b:esc(u.replace(/`/g,'')),o:holders('risk-second-line').map(h=>dn(h.id)).join(', ')||'risk-second-line',roles:['risk','exec','programme'],src:r.data_governance.source,btn:['Open run',`data-run="${r.slug}"`]});
 const byChange={};for(const x of D.approvals.rows){(byChange[x.change_id+' '+x.stage]||=[]).push(x);}
 for(const [k,rows] of Object.entries(byChange)){const x=rows[0];const br=rows.filter(y=>y.breached).length;const nobody=rows.filter(y=>!y.holders.length).map(y=>y.role);
  A.push({sev:br?'cau':'info',agg:true,t:`${k} waits on ${rows.length} approver roles for ${x.age_days} days.`,b:`${br} past their SLA target. ${nobody.length?'No human holds '+nobody.join(', ')+'. ':''}Telemetry from approval-status: it flags, it never blocks.`,o:rows.map(y=>esc(y.role)).join(', '),roles:['programme','exec'],src:D.approvals.source,btn:['Queue','data-v="install"']});
  for(const y of rows){const mapped=roleOfRegistry(y.role);if(mapped.length)A.push({sev:y.breached?'cau':'info',t:`${y.change_id} ${y.stage} waits on your ${y.role} decision: ${y.age_days} days.`,b:`Target ${y.target_days} days${y.breached?', breached':''}. Telemetry: it flags, it never blocks.`,o:y.holders.map(dn).join(', ')||'no human holds '+esc(y.role),roles:mapped,perRole:true,src:D.approvals.source,btn:['Installation','data-v="install"']});}}
 for(const r of byStatus('awaiting-reaction'))A.push({sev:'cau',t:`${r.slug}: prototype built, no reaction recorded.`,b:`D9 stays open until the named roles record a verdict on ${r.hypotheses.map(h=>h.id).join(' and ')}.`,o:dn(r.sponsor?.id),roles:['programme','facilitator',...(r.sponsor?.id===poId?['product']:[]),...(r.product_profile?.id==='ai-decision-system'?['audit']:[])],sponsor:r.sponsor?.id,src:r.gates_source,btn:['Open run',`data-run="${r.slug}"`]});
 for(const r of runs)if(r.npa&&r.npa.conditions.length)A.push({sev:'cau',t:`${r.slug}: ${r.npa.receipt} approved with ${r.npa.conditions.length} conditions.`,b:`No record in the tree shows any condition met. Valid until ${fmtDate(r.npa.valid_until)}.`,o:dn(r.npa.approved_by),roles:['exec','risk'],src:r.npa.source,btn:['Open run',`data-run="${r.slug}"`]});
 const pend=D.registers.obligations.filter(o=>o.article_status==='owner-verification-pending');
 if(pend.length)A.push({sev:'cau',t:`${pend.length} obligations name a source and leave the article to their owner.`,b:esc(pend.map(o=>o.id).join(' · ')),o:[...new Set(pend.map(o=>o.owner_role))].join(', '),roles:['risk','context','audit'],src:D.registers.obligations_source,btn:['See register','data-go="brain"']});
 const stand=D.registers.obligations.filter(o=>o.article_status==='demo-stand-in');
 if(stand.length)A.push({sev:'info',t:`${stand.length} template obligations carry a demo stand-in citation.`,b:'The demo writes "demo fixture" over the template articles, the way the CI dry-run stands in for compliance. A real adoption cites each article.',o:'compliance',roles:['risk','audit'],src:D.registers.obligations_source,btn:['See register','data-go="brain"']});
 for(const e of (D.brainkit?.radar||[]))if(e.review_by&&daysTo(e.review_by)<=30)A.push({sev:daysTo(e.review_by)<0?'crit':'cau',t:`Radar review ${daysTo(e.review_by)<0?'overdue':'due in '+daysTo(e.review_by)+' days'}: ${esc(e.technology)}.`,b:`Ring: ${e.ring}.`,o:dn(e.owner),roles:['context','platform'],src:D.brainkit.source,btn:['Open radar','data-go="brain"']});
 const seats=D.identities.filter(i=>/^ADOPT/.test(i.display||'')&&i.roles.some(r=>r.startsWith('shariah')));
 const isl=runs.filter(r=>r.product_profile?.id==='islamic-product');
 if(seats.length&&isl.length)A.push({sev:'cau',t:`${seats.length} Shari'ah seats are still placeholders.`,b:`${isl.map(r=>r.slug).join(', ')} runs under islamic-product, whose approvals route to the Shari'ah committee. The registry names nobody yet.`,o:'institutional-context-owner, shariah-compliance',roles:['risk','context','audit'],src:{file:'docs/governance/identities.json',kind:'record'},btn:['Open run',`data-run="${isl[0].slug}"`]});
 if(D.installation.floor_blocked_by)A.push({sev:'info',t:'The Factory Floor is not stood up.',b:esc(D.installation.floor_blocked_by)+'. Authors work with the facilitator until data protection and second line sign it.',o:holders('platform-admin').map(h=>dn(h.id)).join(', '),roles:['platform','programme'],src:D.installation.source,btn:['Installation','data-v="install"']});
 return A;
}

}

VIEWS.runs=()=>{
 const R=ROLES[role];const mineOnly=R.owner&&!showAll;const base=mineOnly?runs.filter(r=>r.sponsor?.id===poId):runs;
 const list=base.filter(r=>runFilter==='all'||r.status===runFilter);
 const fb=(k,l)=>{const n=k==='all'?base.length:base.filter(r=>r.status===k).length;return n||k==='all'?`<button class="chip" data-filter="${k}" aria-pressed="${runFilter===k}">${l} · ${n}</button>`:'';};
 return `
 <div class="vh"><div><span class="label">Discovery runs</span><h1 style="margin-top:6px">Every idea, its stage, <em>its prototype and its PRD.</em></h1><p>Stage and status are derived from which artifacts exist and what the D1–D9 validator returned when this page was generated. In the Loom the PRD is the hand-off record: a run has one only when all nine gates pass.</p></div></div>
 ${R.owner?`<div class="row" style="margin-bottom:10px;gap:10px"><span class="badge b-ember">${mineOnly?`${base.length} runs sponsored by ${esc(HUM[poId]?.display||poId)}`:'all '+runs.length+' runs'}</span><button class="btn" data-owners="1">${mineOnly?'Show all '+runs.length:'Show only mine'}</button></div>`:''}
 <div class="row sp" style="margin-bottom:12px">
  <div class="chips">${fb('all','All')}${fb('in-progress','In progress')}${fb('awaiting-reaction','Awaiting reaction')}${fb('gate-failing','Gate failing')}${fb('handed-off','Handed off')}${fb('stopped','Stopped')}</div>
  <span class="cap">Gate chip ·nr = fails because the stage is not reached yet</span>
 </div>
 <div data-for="programme product facilitator exec"><div class="tbl-wrap"><table>
  <thead><tr><th>Run</th><th>Stage</th><th>Gates (validator)</th><th>Prototype</th><th>PRD / outcome</th><th>Status</th><th>Sponsor</th></tr></thead>
  <tbody>${list.map(r=>`<tr class="click" data-run="${r.slug}">
   <td><div class="mono" style="color:var(--bone-0);font-size:12.5px">${r.slug}</div><div class="cap">${esc(r.title)}</div></td>
   <td>${track(r)}<div class="cap" style="margin-top:4px">stage ${r.stage.id} · ${r.stage.name}</div></td>
   <td><span class="mono num" style="font-size:12.5px">${passCount(r)} pass</span><div class="cap num">${failReached(r)?failReached(r)+' failing · ':''}${failUnreached(r)} not reached</div></td>
   <td>${r.prototype?'<span class="file">'+esc(r.prototype.wireframe.split('/').pop())+'</span>':'<span class="cap">not yet</span>'}</td>
   <td>${r.artifacts.handoff&&r.status==='handed-off'?'<span class="file">handoff.md</span>':r.artifacts.outcome?'<span class="file">outcome.md</span>':'<span class="cap">not yet</span>'}</td>
   <td>${statusBadge(r)}</td>
   <td style="font-size:13px">${dn(r.sponsor?.id)}</td></tr>`).join('')}</tbody>
 </table></div></div>
 ${role==='facilitator'?`<div class="card for-me" data-for="facilitator" style="margin-top:16px"><div class="row sp" style="margin-bottom:10px"><h3>Your queue</h3><span class="cap">one next step per run · the exact validator command, and the skill to invoke</span></div><div class="q-list">${runs.filter(r=>r.status!=='stopped').map(r=>{const n=nextStep(r);return `<div class="q-item"><div><span class="mono" style="color:var(--bone-0);font-size:12.5px">${r.slug}</span> <span class="cap">· ${n.t} · author ${esc(HUM[r.sponsor?.id]?.display||r.sponsor?.id)}</span>${n.cmds.map(c=>`<div class="term" style="margin-top:6px;padding:8px 12px"><code><span class="p">$</span> ${esc(c)}</code></div>`).join('')}</div><button class="btn" data-run="${r.slug}">Open</button></div>`;}).join('')}</div></div>`:''}`;
};

function nextStep(r){
 const v=`node discovery/gates/validate.mjs discovery/runs/${r.slug}`;
 if(r.status==='stopped')return {t:'Nothing owed',b:`Stopped by ${HUM[r.outcome?.decided_by]?.display||r.outcome?.decided_by}. A stop is a result: it records who decided, why, and what would reopen it.`,cmds:[],skill:null};
 if(r.status==='handed-off')return {t:'Develop',b:'The right diamond picks it up. The develop skill requires the run to validate first, then explores at least three solution directions against the hand-off.',cmds:[v],skill:'develop'};
 if(r.status==='gate-failing'){const g=gate(r,r.blocked_by[0]);return {t:`Fix ${g.id} ${g.name}`,b:`The validator says: "${g.issues.join('; ')}". Read it back to the author in plain words, then re-run the gates.`,cmds:[v],skill:'discovery'};}
 if(r.status==='awaiting-reaction')return {t:'Record the stakeholder reaction',b:`Show the wireframe to the named roles; record a verdict per hypothesis as new signals. Bind the reaction to the prototype it saw with the digest below.`,cmds:[`${v} --prototype-digest`,v],skill:'discovery'};
 const s=STAGES.find(x=>x[0]===r.stage.id);
 const what={'1':'Keep gathering signals; the synthesis is the next record','2':'Write the synthesis','3':'Frame the problem','4':'Data-governance feasibility: map the data to the register; the data-governance reviewer checks coverage','5':'Build the low-fidelity prototype'}[r.stage.id]||`Stage ${s?s[1]:r.stage.id}`;
 return {t:what,b:'Continue the run with the discovery skill; the validator is the check before anything is frozen.',cmds:[v],skill:'discovery'};
}

VIEWS.run=()=>{
 const r=runs.find(x=>x.slug===curRun)||runs[0];
 const cls={d:'done',c:'cur',f:'fail',s:'stop',t:'todo'};
 const cells=STAGES.map(([sid,name,art])=>{const st=stageState(r,sid,art);const gl=STAGE_GATES[sid].join(' ');return `<div class="bt ${cls[st]}"><span class="n">${sid}${gl?' · '+gl:''}</span><b>${name}</b><span class="f">${r.artifacts[art]?esc(r.artifacts[art].split('/').pop()):'—'}</span><span>${st==='d'?'<span class="badge b-pos">in record</span>':st==='c'?'<span class="badge b-ember">current</span>':st==='f'?'<span class="badge b-crit">gate failing</span>':st==='s'?'<span class="badge b-none">not reached · stopped</span>':'<span class="cap">not reached</span>'}</span></div>`;}).join('')
  +`<div class="bt right"><span class="n">right diamond</span><b style="color:${r.status==='handed-off'?'var(--bone-0)':'var(--bone-3)'}">Develop → Deliver</b><span class="f">develop · next-story</span><span>${r.status==='handed-off'?'<span class="badge b-info">may start</span>':'<span class="cap">—</span>'}</span></div>`;
 const wf=WF[r.slug];const wfSrc=r.prototype?.site_wireframe||null;
 const proto=r.prototype?`${wf?`<iframe class="wf" title="Wireframe for ${esc(r.slug)}" sandbox srcdoc="${esc(wf)}"></iframe>`:wfSrc?`<iframe class="wf" title="Wireframe for ${esc(r.slug)}" sandbox src="${esc(wfSrc)}"></iframe>`:'<div class="nopro">The wireframe exists in the tree but is not part of this build.</div>'}
   <div class="stack" style="margin-top:10px;gap:6px"><div class="row sp"><span class="cap">The committed asset, as rendered by the discovery renderer. Low fidelity, synthetic, disposable.</span>${prov({file:r.prototype.wireframe,kind:'record'},'wireframe.html')}</div>
   <div class="kv"><div class="l"><span>Prototype digest</span><span class="dig">${esc(r.prototype.digest)}</span></div>${prov({file:r.prototype.brief,kind:'executed-check'},'recomputed')}</div>
   <div class="kv"><div class="l"><span>Reaction bound to</span><span class="dig">${esc(r.prototype.reaction_bound_to||'no reaction recorded')}</span></div><span class="badge ${r.prototype.reaction_binding==='bound'?'b-pos':r.prototype.reaction_binding==='stale'?'b-crit':'b-cau'}">${r.prototype.reaction_binding==='bound'?'matches':r.prototype.reaction_binding==='stale'?'STALE':'none yet'}</span></div></div>`
  :`<div class="nopro">No prototype yet. It is built at stage 5, after the problem and the data position are settled.</div>`;
 const prd=r.status==='handed-off'&&r.handoff?`<div class="prd"><dl>

  </dl><div class="row sp" style="margin-top:12px">${prov(r.handoff.source,'handoff.md')}<span class="cap">Signatures on the hand-off: none recorded in the tree.</span></div></div>`
  :r.outcome?`<div class="prd"><dl><dt>Outcome</dt><dd>${esc(r.outcome.outcome)}</dd><dt>Decided by</dt><dd>${dn(r.outcome.decided_by)} on ${fmtDate(r.outcome.decided_at)}</dd><dt>Reason</dt><dd>${esc(r.outcome.reason)}</dd></dl><div class="row sp" style="margin-top:12px">${prov(r.outcome.source,'outcome.md')}<span class="cap">A stopped run never has a PRD.</span></div></div>`
  :`<div class="nopro">No PRD. The hand-off is written only when all nine gates pass; ${passCount(r)} pass now.</div>`;
 const npa=r.npa?`<div class="card" data-for="exec risk audit" style="margin-top:16px"><div class="row sp" style="margin-bottom:8px"><h3>${esc(r.npa.receipt)} · New Product Approval</h3><div class="row"><span class="badge b-cau">${esc(r.npa.decision)}</span>${prov(r.npa.source,'decision.json')}</div></div><p style="font-size:14px">Decided by ${dn(r.npa.approved_by)} on ${fmtDate(r.npa.decided_at)}, valid until ${fmtDate(r.npa.valid_until)}. Evidence status: <span class="mono">${esc(r.npa.evidence_status)}</span>.</p><ol class="cond-list">${r.npa.conditions.map(c=>`<li>${esc(c)}</li>`).join('')}</ol><p class="cap" style="margin-top:8px">No record in the tree marks any condition met. Delivery inherits them.</p></div>`:'';
 const hyp=r.hypotheses.length?r.hypotheses.map(h=>{const c={confirmed:'b-pos',refuted:'b-crit',uncertain:'b-cau','not-tested':'b-none',open:'b-none'}[h.verdict]||'b-none';return `<div class="kv"><div class="l"><span><span class="mono" style="color:var(--bone-3)">${h.id}</span> ${esc(h.text)}</span>${h.reactions.length?`<span class="dig">${h.reactions.map(x=>esc(x.stakeholder)+': '+esc(x.verdict)).join(' · ')}</span>`:''}</div><span class="badge ${c}">${esc(h.verdict)}</span></div>`;}).join(''):'<p class="cap">Hypotheses are framed at stage 3.</p>';
 const dg=r.data_governance;
 const ctrlName=id=>D.registers.controls.find(c=>c.id===id)?.name||'';
 const n=nextStep(r);
 const opts=runs.map(x=>`<option value="${x.slug}" ${x.slug===r.slug?'selected':''}>${x.slug}</option>`).join('');
 return `
 <div class="vh"><div><div class="row" style="gap:8px"><label class="label" for="runPick">Run</label><select id="runPick" class="po">${opts}</select>${prov({file:'discovery/runs/'+r.slug,kind:'record'},'discovery/runs/'+r.slug)}</div>
  <h1 style="margin-top:10px">${esc(r.title)}</h1>
  <div class="row" style="margin-top:10px;gap:8px">${statusBadge(r)}<span class="chip">sponsor ${esc(HUM[r.sponsor?.id]?.display||r.sponsor?.id)}${r.sponsor?.resolves?'':' ✗ not in registry'}</span><span class="chip">profile ${esc(r.product_profile?.id||'—')}</span><span class="chip">intent ${esc(r.strategic_intent?.id||'—')}${r.strategic_intent&&!r.strategic_intent.resolves?' ✗':''}</span><span class="chip">${r.signals.count} signals</span>${r.synthetic?'<span class="badge b-none">synthetic data</span>':''}</div></div></div>
 ${r.product_profile?.id==='ai-decision-system'?`<div class="card" data-for="audit risk" style="margin-bottom:16px;border-color:rgba(93,143,166,.45);background:var(--info-dim)"><span class="label" style="color:var(--info-text)">Model-bearing run · ai-decision-system</span><p style="margin-top:4px;color:var(--bone-0);font-size:14px">The profile routes model risk into this run. Controls it cites: ${(dg?.controls||[]).map(c=>`<span class="mono">${c}</span> ${esc(ctrlName(c))}`).join('; ')||'none yet'}. Model validation is held by ${holders('model-validator').map(h=>dn(h.id)).join(', ')}; governance decision ${hgCite('HG-0006')}.</p></div>`:''}
 <div data-for="product programme facilitator"><div class="bigtrack-wrap"><div class="bigtrack">${cells}</div></div></div>

 <div class="card" data-for="facilitator audit product" style="margin-top:16px">
  <div class="row sp" style="margin-bottom:8px"><h3>Gates, as the validator returned them</h3>${prov(r.gates_source)}</div>
  <div class="tbl-wrap"><table class="gtable"><thead><tr><th>Gate</th><th>Result</th><th>What it found</th></tr></thead><tbody>
  ${r.gates.map(g=>`<tr><td><span class="mono" style="color:var(--bone-0)">${g.id}</span> <span class="cap">${esc(g.name)}</span></td><td class="gstat"><span class="badge ${g.status==='pass'?'b-pos':g.status==='skip'?'b-none':g.reached?'b-crit':'b-cau'}">${g.status}${g.status==='fail'&&!g.reached?' · not reached':''}</span>${g.verdict?` <span class="cap">verdict: ${g.verdict}</span>`:''}</td><td class="cap">${g.issues.length?esc(g.issues.join(' · ')):'—'}</td></tr>`).join('')}
  </tbody></table></div>
 </div>

 <div class="grid g2" style="margin-top:16px">
  <div class="card" data-for="product facilitator"><div class="row sp" style="margin-bottom:12px"><h3>Prototype</h3></div>${proto}</div>

   <div class="card" data-for="product risk exec"><div class="row sp" style="margin-bottom:12px"><h3>PRD · hand-off</h3>${r.status==='handed-off'?'<span class="badge b-pos">9 of 9 pass</span>':''}</div>${prd}</div>
   <div class="card" data-for="product audit exec"><h3 style="margin-bottom:8px">Hypotheses</h3>${hyp}</div>

 ${npa}

 <div class="card" data-for="facilitator product programme" style="margin-top:16px"><h3 style="margin-bottom:10px">Next step</h3>

 if(!VIEWS[v])v='overview';
 document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===v?'page':'false'));
 const view=$('#view');view.classList.toggle('lens',role!=='all');
 view.innerHTML=banner()+VIEWS[v]();
 if(role!=='all')view.querySelectorAll('[data-for]').forEach(el=>{if(el.dataset.for.split(' ').includes(role))el.classList.add('for-me');});
 renderRoles();
 $('#crumbs').innerHTML=esc(D.institution.profile)+' / loom / '+(v==='run'?'runs / <b>'+esc(curRun)+'</b>':'<b>'+({overview:'overview',brain:'brain',runs:'runs',install:'installation'}[v])+'</b>');
 try{history.replaceState(null,'','#'+(v==='run'?'run-'+curRun:v))}catch(e){}
 const pick=$('#runPick');if(pick)pick.addEventListener('change',e=>{curRun=e.target.value;render('run')});
 const pp=$('#poPick');if(pp)pp.addEventListener('change',e=>{poId=e.target.value;try{localStorage.setItem('loom-po',poId)}catch(err){}render($('#view .vh .label')?.textContent==='Discovery runs'?'runs':'runs');});
 window.scrollTo(0,0);
}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{el.hidden=true},2600);}
document.addEventListener('click',e=>{
 const rl=e.target.closest('[data-role]');if(rl){role=rl.dataset.role;showAll=false;runFilter='all';try{localStorage.setItem('loom-role',role)}catch(err){}render(ROLES[role].home);return;}
 const c=e.target.closest('[data-copy]');if(c){e.stopPropagation();const t=c.dataset.copy;try{navigator.clipboard.writeText(t).then(()=>toast('Copied: '+t),()=>toast(t));}catch(err){toast(t);}return;}
 const ow=e.target.closest('[data-owners]');if(ow){showAll=!showAll;render('runs');return;}
 const n=e.target.closest('[data-v]');if(n){render(n.dataset.v);return;}
 const g=e.target.closest('[data-go]');if(g){render(g.dataset.go);return;}
 const f=e.target.closest('[data-filter]');if(f){runFilter=f.dataset.filter;render('runs');return;}
 const r=e.target.closest('[data-run]');if(r){curRun=r.dataset.run;render('run');}
});
function fromHash(){let h=(location.hash||'').slice(1);if(h.startsWith('as-')&&ROLES[h.slice(3)]){role=h.slice(3);h=ROLES[role].home;}if(h.startsWith('run-')){const s=h.slice(4);if(runs.some(r=>r.slug===s)){curRun=s;h='run';}}render(h||'overview');}
window.addEventListener('hashchange',fromHash);
fromHash();

</script>

# Reference CI workflow for a Loom adoption. Copy to .github/workflows/ci.yml (a control-plane
# file — own it in CODEOWNERS, HG-0002). `control-plane-check.mjs` names this exact path as a
# CONTROL_TARGET; this file is what it guards.
#
# ONE SOURCE OF TRUTH (rc.26). Until now this file carried an explicit list of every gate, and
# `core/gate-runner.mjs` derived the same list from the control catalog — two paths that had to be
# kept saying the same thing. They did not: ten gates once ran here with no catalog entry, so the
# runner would not have executed a single one of them. `ci-catalog-check` closed that hole, but
# closing a hole is not the same as not having two paths, so the list is gone. CI now asks the
# CATALOG what to run, per lane. Adding a gate means adding a control — there is nowhere else to
# put it, and nothing to keep in step.
#
# What the runner gives you that a list cannot: risk-proportionate execution. It runs what THIS
# diff implicates, and RECORDS every skip with its reason (`gate-run-*.json` below). A control
# whose compiled plan requires it becomes unskippable whatever the diff touches. Skipping is never
# silent — that property is why replacing the list is safe rather than merely tidier.
#
# ADOPT: add your project's own Q-gates (build+unit, SAST, integration) per
# ../loom/references/delivery-harness.md, and fill the SAST/SCA seams (Snyk/Chainguard, see
# supply-chain-security.md). Node >= 18.
name: loom-gates

on:
  push:
    branches: [main]
  pull_request:
  merge_group:   # the routine auto-merge lane runs in the merge-queue context

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Q1b + secrets history need real git history, not a shallow clone
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundled test suites (discovery gates + renderer + the gate tests)
        run: node --test discovery/gates/*.test.mjs discovery/render/*.test.mjs scripts/*.test.mjs core/*.test.mjs

      - name: Control catalog is complete and honest
        # Run before the runner, because the runner TRUSTS the catalog: these two gates are what
        # make that trust earned. The catalog may not overstate a control's state, and it may not
        # omit a gate this workflow runs — the second is what stops the list-vs-runner divergence
        # from coming back in a new form.
        run: |
          node scripts/control-catalog-check.mjs
          node scripts/ci-catalog-check.mjs
          node scripts/self-claims-check.mjs      # bundle-only; inert in an adopted tree
          node scripts/discovery-sync-check.mjs   # bundle-only; the ofbo back-port debt, counted

      - name: Gates — pr lane (risk-proportionate; every skip recorded)
        run: node core/gate-runner.mjs --lane pr --base origin/main --out gate-run-pr.json

      - name: Gates — scheduled lane (runtime assurance; safe to run per PR)
        run: node core/gate-runner.mjs --lane scheduled --out gate-run-scheduled.json

      - name: Gates — build · release · deploy lanes
        # rc.11 WS1: release-evidence checks stopped masquerading as PR-source checks. On a PR
        # these mostly find nothing to check and say so; on a release build they are the gate.
        run: |
          node core/gate-runner.mjs --lane build   --out gate-run-build.json
          node core/gate-runner.mjs --lane release --out gate-run-release.json
          node core/gate-runner.mjs --lane deploy  --out gate-run-deploy.json

      # ── The four the runner structurally cannot drive, each for a stated reason ──────────────
      # This list is short ON PURPOSE and every entry is `execute: false` in the catalog with an
      # `execute_note` saying who runs it instead. If it grows, something is wrong: the default
      # answer for a new gate is a catalog entry, not a line here.

      - name: Q1b test integrity (needs the merge base, which the runner does not supply)
        run: node scripts/test-integrity-check.mjs --base origin/main

      - name: Discovery runs are gate-green (D1–D9)
        # Runs per discovery-run DIRECTORY, so it is a loop rather than one invocation.
        # rc.13 WS3: the data-risk register is MANDATORY-WHEN-COMPILED — if any governed change's
        # compiled plan requires the data_risk_register capability (a regulated/institution profile
        # is in its envelope), a missing register FAILS D6 with NO flag. --require-register /
        # LOOM_REQUIRE_REGISTER survive only as a manual TIGHTENING (they can force it on, never turn
        # a compiled requirement off) — a CI-config change can no longer weaken a regulated build. A
        # non-regulated adopter with no compiling change and no flag still skips. There are no
        # discovery/runs/ until you author one — by then, mount your register.
        run: |
          shopt -s nullglob
          for run in discovery/runs/*/; do
            node discovery/gates/validate.mjs "$run" --require-register
          done

      - name: Cost telemetry (report, never a gate)
        # Not a control, so deliberately not in the catalog: cost is a signal for humans and must
        # never block a merge. `ci-catalog-check` exempts it by name, in a printed list.
        run: node scripts/token-report.mjs --check

      - name: Gate-run records (what ran, what skipped, and why)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loom-gate-runs
          path: gate-run-*.json
          if-no-files-found: warn

  # Routine auto-merge lane (HG-0013) — its OWN job, hence its OWN status context. GitHub
  # reports a check per job, not per step: while this lived as a step inside `gates`, an
  # ordinary PR (which is SUPPOSED to fail `--assert-routine`) failed the whole `gates` job and
  # could not be merged even by a human. As a separate job it fails in isolation.
  #
  # ADOPT (branch protection): mark `gates` required for every PR; do NOT mark `routine-qualified`
  # required. Instead point the merge queue / auto-merge ruleset at `routine-qualified` alone, so
  # ONLY a genuinely qualifying routine claim auto-merges and every ordinary PR still needs a human.
  # It runs on pull_request + merge_group (never on the push-to-main build, where it would flake red).
  routine-qualified:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: routine-qualified (exits 0 only for a qualifying routine claim)
        run: node scripts/routine-change-check.mjs --assert-routine --base origin/main

# ─────────────────────────────────────────────────────────────────────────────
# DELIBERATELY NOT A JOB HERE: scripts/adoption-attest.mjs (rc.14 · WS5 · F7).
#
# It verifies the signed claim "this repository has adopted the Loom to stage N", and its central
# rule is that no such claim may be produced while ANY mandatory item is still adopt-pending.
#
# That rule makes it the wrong shape for a per-PR gate on a FRESH adoption. A repo that has just run
# adopt.mjs has adopt-pending items by design — the installer never fakes activation — so wiring
# this in on day one gives every new adopter a permanently red build with no path to green except
# completing the whole adoption. A gate that is red from the first commit is a gate that gets
# deleted, and deleting it is worse than never adding it. (`--tier core` makes that list much
# shorter, but it is still not zero on day one.)
#
# Run it as a COMMAND while adopting (`node scripts/adoption-status.mjs --run` to see what is
# outstanding and what actually passes, then `attest-adoption` once nothing is), and add it as a job
# here once your adoption is attested — from that point it is exactly the right gate, because it
# fails if the adoption ever regresses.
#
#   - name: adoption attested (add once your adoption is complete)
#     run: node scripts/adoption-attest.mjs
#
# The Loom's own CI asserts the NEGATIVE instead: its dry-run repo is half-adopted, so it proves a
# signed report is impossible there. The positive path is covered by scripts/adoption-attest.test.mjs.

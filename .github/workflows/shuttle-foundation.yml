name: SHUTTLE portable foundation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pocs/shuttle/**'
      - '.github/workflows/shuttle-foundation.yml'

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pocs/shuttle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: pocs/shuttle/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate public fixtures, core and Dataverse adapter
        run: bash scripts/verify-local.sh

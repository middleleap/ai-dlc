name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    # id-token: write lets the job request a GitHub OIDC token for the runner-identity check below.
    # Fork pull requests get none; the check is inert there and says so.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the validator finds the commit that set each plugin's version and fails
          # when content changed after it. A depth-1 clone makes that check silently pass.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate manifests, skills, and agents
        run: node scripts/validate-marketplace.mjs
      - name: Open Finance staleness script — offline tests
        run: python3 plugins/middleleap-open-finance-uae/skills/open-finance-uae/scripts/test_check_current.py

      # Three skills are imported from the Claude.ai skills UI as whole-file overwrites. This
      # fails the PR if a re-import brings a client's name back into the public marketplace.
      - name: De-identification gate (no client names under plugins/)
        run: node scripts/deidentify-check.mjs

      # PR6, second half, proved on the platform: the job's own OIDC token verifies against GitHub's
      # published keys and its claims match the job (core/runner-identity.mjs; seam question 3).
      - name: Runner identity — the job's OIDC token verifies against the issuer (PR6, question 3)
        run: node plugins/middleleap-loom/skills/loom-adopt/harness/scripts/runner-identity-check.mjs

      # The validator is the only gate this repo has, so it is itself gated: the
      # suite builds throwaway git repos and asserts every violation still fails.
      - name: Validator self-test
        run: node --test scripts/*.test.mjs   # every root test, by glob, so a new one cannot be left out

      # The Loom console (apps/loom-console) is a standalone app over any installation, not part of a
      # plugin. Its tests build the Meridian Trust demo installation and hold the console to it.
      - name: Loom console — reader, build, read-only server
        run: node --test apps/loom-console/test/*.test.mjs
      - name: Loom harness — full suite in the bundle layout (bundle-only branches run here)
        working-directory: plugins/middleleap-loom/skills/loom-adopt/harness
        run: node --test discovery/gates/*.test.mjs discovery/render/*.test.mjs scripts/*.test.mjs core/*.test.mjs demo/meridian/*.test.mjs

      - name: Onboarding handoff, configuration and all-tier installation contracts
        run: node --test plugins/middleleap-loom/skills/loom-adopt/harness/scripts/intake-*.test.mjs plugins/middleleap-loom/skills/loom-adopt/harness/scripts/onboarding-commands.test.mjs plugins/middleleap-loom/skills/loom-adopt/harness/scripts/configuration-tasks.test.mjs plugins/middleleap-loom/skills/loom-adopt/harness/scripts/brainkit-reuse.test.mjs plugins/middleleap-loom/skills/loom-adopt/harness/scripts/project-integration.test.mjs plugins/middleleap-loom/skills/loom-adopt/harness/scripts/codex-runtime.test.mjs

      - name: Rendered separate workflow is valid and rejects dangling dependencies
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint"
          node plugins/middleleap-loom/skills/loom-adopt/harness/adopt.mjs --dest "$RUNNER_TEMP/loom-separate" --ci separate
          workflow="$RUNNER_TEMP/loom-separate/.github/workflows/loom.yml"
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes= "$workflow"
          sed -i 's/needs: loom-governance/needs: gates/' "$workflow"
          if "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes= "$workflow" > "$RUNNER_TEMP/workflow-negative.log" 2>&1; then
            echo '::error::Dangling governance dependency passed workflow validation'
            exit 1
          fi
          grep -q 'job "gates"' "$RUNNER_TEMP/workflow-negative.log"

      - name: Loom doc-integrity — generated docs match their source of truth (rc.7 W4/W6)
        working-directory: plugins/middleleap-loom/skills/loom-adopt/harness
        run: |
          node scripts/doc-integrity-check.mjs   # copy table ← copy-manifest; scorecard ← control catalog
          node scripts/self-claims-check.mjs     # rc.26 — the bundle is held to its own claims
          node scripts/intake-check.mjs          # 2.3.0 — questionnaire.html ← intake/questions.json + prefill packs
          # ── Negative bypass: a bank edit without a rebuild must be SEEN failing ──────────────
          node -e 'const fs=require("fs");const p="intake/questions.json";const b=JSON.parse(fs.readFileSync(p));b.questions.push({id:"I9",block:"I",prompt:"probe",hint:"",type:"text",home:"x"});fs.writeFileSync(p,JSON.stringify(b,null,2)+"\n")'
          if node scripts/intake-check.mjs; then
            echo "::error::intake-check passed on a question bank edited without rebuilding the questionnaire"; exit 1; fi
          git checkout -- intake/questions.json
          node scripts/intake-check.mjs > /dev/null
          # ── Negative bypass test for C5, the documented-flag rule (rc.32) ────────────────
          # C5 exists because this gate MISSED a defect: rc.29 advertised `--reconcile` in the
          # header of discovery-sync-check.mjs and never implemented it. Prove the rule bites, on
          # the very file that shipped the fault. `git checkout --` is safe here — this step runs
          # at the repo root, before the dry-run's `cd "$A"`.
          printf '\n// node scripts/discovery-sync-check.mjs --ci-probe-flag\n' >> scripts/discovery-sync-check.mjs
          if node scripts/self-claims-check.mjs; then
            echo "::error::a CLI advertised a flag it does not implement and the self-claims gate passed — the rc.29 class is invisible again"; exit 1; fi
          git checkout -- scripts/discovery-sync-check.mjs
          node scripts/self-claims-check.mjs > /dev/null   # and it is clean again after the restore
          node scripts/discovery-sync-check.mjs  # rc.29 — the ofbo back-port debt, counted not remembered
          # ── Negative bypass tests for the sync ledger (rc.29) ─────────────────────────────
          # This gate's whole value is that an undeclared change CANNOT pass. Prove it both ways
          # on a scratch copy of the tree, then restore — `git checkout --` is safe here because
          # this step runs at the repo root, before the dry-run's `cd "$A"`.
          #   ① a modified tracked file with no declared debt
          printf '\n// undeclared divergence\n' >> discovery/gates/lib.mjs
          if node scripts/discovery-sync-check.mjs; then
            echo "::error::discovery-sync passed on a tracked file changed without declaring the port owed — the drift is silent again"; exit 1; fi
          git checkout -- discovery/gates/lib.mjs
          #   ② a NEW file in the tracked tree. A file that exists here and not upstream is a
          #      divergence by definition, and is the way a tree grows apart without any diff.
          printf '// added, never recorded\n' > discovery/gates/_ci-probe.mjs
          if node scripts/discovery-sync-check.mjs; then
            echo "::error::discovery-sync passed on an untracked new file in discovery/ — the ledger no longer covers the tree"; exit 1; fi
          rm -f discovery/gates/_ci-probe.mjs
          #   ③ the ledger may not assert more than it has seen — tested as a RULE, not by pinning
          #      today's values. The first version of this step asserted `last_reconciled === null`
          #      outright, which froze "never reconciled" as an invariant: the moment somebody ran
          #      the reconciliation and committed it, CI would go red and the only fix would be
          #      deleting this check. Forge the claim instead, and require the gate to catch it.
          cp discovery-sync.json "$RUNNER_TEMP/ledger-pristine.json"
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const l = JSON.parse(readFileSync("discovery-sync.json", "utf8"));
            l.files["discovery/gates/lib.mjs"].upstream = "sha256:invented";   // nobody has seen ofbo
            writeFileSync("discovery-sync.json", JSON.stringify(l, null, 2));
          '
          if node scripts/discovery-sync-check.mjs; then
            echo "::error::the ledger carried an upstream digest with no recorded reconciliation and the gate passed — it is asserting what it cannot see"; exit 1; fi
          cp "$RUNNER_TEMP/ledger-pristine.json" discovery-sync.json
          #   ④ and the converse, which matters just as much: a ledger that HAS been reconciled must
          #      still pass. This is the action the frozen assertion used to punish.
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const l = JSON.parse(readFileSync("discovery-sync.json", "utf8"));
            l.upstream.last_reconciled = "2026-01-01"; l.upstream.last_reconciled_ref = "ci-probe";
            for (const e of Object.values(l.files)) { e.upstream = e.bundle; e.base = e.bundle; e.state = "reconciled"; }
            writeFileSync("discovery-sync.json", JSON.stringify(l, null, 2));
          '
          node scripts/discovery-sync-check.mjs || {
            echo "::error::a fully reconciled ledger failed the gate — the conditional rule has been frozen back into a fixed fact"; exit 1; }
          cp "$RUNNER_TEMP/ledger-pristine.json" discovery-sync.json
          node scripts/discovery-sync-check.mjs > /tmp/ds.txt
          grep -q 'NOT VERIFIED' /tmp/ds.txt || {
            echo "::error::discovery-sync reported a clean run without stating that upstream was never compared"; exit 1; }

      - name: Loom bundle — adoption dry-run (manifest-driven install via adopt.mjs — rc.8 WS1)
        run: bash scripts/ci/loom-dry-run.sh

      - name: Loom bundle — negative bypass tests (a bypassed control must be SEEN failing)
        run: bash scripts/ci/loom-negative-bypass.sh

      - name: Loom — the external-record seam end to end against the fake (2.1.0, hardening plan row 2.13)
        # From adoption to the audit package with a GREEN pr lane, two deliberate refusals, no Kosli
        # org (decision K8). Proves the harness; the real-org half is docs/integration-run.md. The
        # meridian scenario adds the one-obligation trace and the join (2.4.3).
        run: |
          node plugins/middleleap-loom/skills/loom-adopt/harness/demo/run-demo.mjs
          node plugins/middleleap-loom/skills/loom-adopt/harness/demo/run-demo.mjs --scenario meridian

      - name: Loom — evidence is derived, not authored (rc.35, flow-plan Phase 2)
        run: |
          # The collector must reproduce the hand-built worked example FROM THE ARTIFACTS ALONE —
          # same entry order (the seal gate's required-types contract), same seals, same anchor,
          # zero hand-computed digests. Run in a scratch dir with no governed changes so the
          # required-types contract is the fixed baseline the example was sealed under.
          H=plugins/middleleap-loom/skills/loom-adopt/harness
          SEAL="$PWD/$H/scripts/seal-evidence.mjs"
          S="$RUNNER_TEMP/seal-derive"
          mkdir -p "$S"
          for f in tests.json reviews.json lineage.json model-provenance.json control-plane.json \
                   sast.sarif sbom.cdx.json dependency-audit.json provenance.json; do
            cp "$H/evidence-example/$f" "$S/"
          done
          ( cd "$S" && node "$SEAL" --dir . --commit 7e3f9c2a4b6d8e0f1a2c3b4d5e6f7a8b9c0d1e2f --release v-demo ) > /tmp/seal-derive.txt
          cat /tmp/seal-derive.txt
          # rc.36 D5: outside a git checkout the commit existence/ancestry check CANNOT run, and
          # the collector must SAY so — a recorded not-performable, never a silent pass.
          grep -q 'NOT verified' /tmp/seal-derive.txt || {
            echo "::error::sealing outside a git checkout did not record the commit check as not-performable (D5)"; exit 1; }
          node -e '
            const { readFileSync } = require("node:fs");
            const built = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const shipped = JSON.parse(readFileSync(process.argv[2], "utf8"));
            if (built.anchor !== shipped.anchor) {
              console.error(`::error::the derived chain resolves to ${built.anchor}, not the sealed example anchor ${shipped.anchor} — the collector no longer derives what the gate verifies`); process.exit(1); }
            console.log("seal-evidence reproduced the worked-example anchor from the artifacts alone:", built.anchor);
          ' "$S/manifest.json" "$H/evidence-example/manifest.json"
          # The refusal, both halves: a bundle of failing tests must not seal, and the refusal
          # must write NOTHING — the previous manifest stays byte-for-byte intact.
          sed -i 's/"failed": 0/"failed": 3/' "$S/tests.json"
          BEFORE=$(sha256sum "$S/manifest.json")
          if ( cd "$S" && node "$SEAL" --dir . --commit 7e3f9c2a4b6d8e0f1a2c3b4d5e6f7a8b9c0d1e2f ); then
            echo "::error::the collector sealed a bundle of FAILING tests — derived evidence just laundered a failure"; exit 1; fi
          [ "$BEFORE" = "$(sha256sum "$S/manifest.json")" ] || {
            echo "::error::a refused seal still rewrote the manifest — refusal must write nothing"; exit 1; }

      - name: Loom — operations-signal adopter example stays green
        run: |
          cd plugins/middleleap-loom/skills/loom-adopt/harness/operations-example
          node ../scripts/operations-signal-check.mjs

      - name: Loom — BrainKit conformance (rc.8 WS7 · positive path + negative bypass suite)
        working-directory: plugins/middleleap-loom/skills/loom-adopt/harness
        run: |
          # The negative bypass suite: an unapproved/expired BrainKit, a tampered section, an
          # unresolved owner, a stale D7 projection, and a plan pinning the wrong digest must all
          # be SEEN failing (12 cases). Runs the compiler + digest module + gate together.
          node --test scripts/brainkit-check.test.mjs core/policy-compiler.test.mjs core/brainkit.test.mjs
          # The positive path: the sealed, approved Meridian BrainKit passes end to end.
          ( cd brainkit-example && node ../scripts/brainkit-check.mjs )
